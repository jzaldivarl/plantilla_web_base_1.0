<!-- app/templates/erros/404.html -->

{% extends 'base.html' %}

{% block title %}Error 404 - Página no encontrada{% endblock %}

{% block content %}
<div class="container text-center mt-5">
    <h1 class="display-4 text-danger">Error 404</h1>
    <p class="lead">{{ message }}</p>
    <a href="{{ url_for('home.home') }} "class="btn btn-primary" style="font-size: small;">Volver al inicio</a>
</div>
{% endblock %}
