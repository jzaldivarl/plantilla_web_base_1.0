<!-- app/templates/auth/reset_password_request.html -->

{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 360px;">
        <!-- Form title -->
        <h4 class="text-center mb-4">Reset Password</h4>

        <!-- Form to request password reset -->
        <form method="POST" class="needs-validation" novalidate>
            <!-- CSRF Token for protection against CSRF attacks -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Email input field -->
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="youremail@example.com" required>
                <!-- Error message if the email is invalid -->
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
            <!-- PIN input field -->
            <div class="mb-3">
                <label for="pin">PIN Code</label>
                <input type="text" name="pin" class="form-control" minlength="6" maxlength="6" required>
            </div>

            <!-- Button to submit the request -->
            <div class="mt-4 d-grid">
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </div>
        </form>

        <!-- Link to go back to login -->
        <div class="text-center mt-3">
            <a href="{{ url_for('login.login_view') }}">Remembered your password? Log in</a>
        </div>
    </div>
</div>

<script>
    // Form validation in JavaScript
    document.querySelectorAll('.needs-validation').forEach(form => {
        // Event to check form validity on submit
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                // Prevent submission if form is not valid
                event.preventDefault();
                event.stopPropagation();
            }
            // Add class to show errors
            form.classList.add('was-validated');
        });
    });
</script>
{% endblock %}
