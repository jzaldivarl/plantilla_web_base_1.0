<!-- app/templates/auth/reset_password_request.html -->

{% extends 'base.html' %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 360px;">
        <!-- Título del formulario -->
        <h4 class="text-center mb-4">Recuperar Contraseña</h4>

        <!-- Formulario para solicitar recuperación de contraseña -->
        <form method="POST" class="needs-validation" novalidate>
            <!-- CSRF Token para proteger contra ataques CSRF -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Campo para ingresar el email -->
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="tuemail@example.com" required>
                <!-- Mensaje de error si el correo es inválido -->
                <div class="invalid-feedback">Por favor, ingresa un correo válido.</div>
            </div>
            <!-- Campo para ingresar el PIN -->
            <div class="mb-3">
                <label for="pin">Código PIN</label>
                <input type="text" name="pin" class="form-control" minlength="6" maxlength="6" required>
            </div>

            <!-- Botón para enviar la solicitud -->
            <div class="mt-4 d-grid">
                <button type="submit" class="btn btn-primary">Enviar Enlace de Recuperación</button>
            </div>
        </form>

        <!-- Enlace para regresar al login -->
        <div class="text-center mt-3">
            <a href="{{ url_for('login.login_view') }}">¿Recordaste tu contraseña? Inicia sesión</a>
        </div>
    </div>
</div>

<script>
    // Validación del formulario en JavaScript
    document.querySelectorAll('.needs-validation').forEach(form => {
        // Evento para verificar la validez del formulario al enviarlo
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                // Prevenir el envío si el formulario no es válido
                event.preventDefault();
                event.stopPropagation();
            }
            // Agregar clase para mostrar los errores
            form.classList.add('was-validated');
        });
    });
</script>
{% endblock %}
