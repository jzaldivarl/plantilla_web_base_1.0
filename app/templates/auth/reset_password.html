<!-- app/templates/auth/reset_password.html -->

{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 360px;">
        {% if success %}
            <!-- Success message with animation -->
            <div class="text-center">
                <!-- Circle with checkmark animation -->
                <div class="checkmark-circle">
                    <div class="background"></div> <!-- Green circle background -->
                    <div class="checkmark draw"></div> <!-- Checkmark animation -->
                </div>
                <h4 class="text-success mt-3">Password Updated!</h4>
                <p>You can log in with your new password.</p>
                <!-- Button to redirect to login -->
                <a href="{{ url_for('login.login_view') }}" class="btn btn-primary mt-3">Log In</a>
            </div>
        {% else %}
            <!-- Form to reset password -->
            <h4 class="text-center mb-4">Reset Password</h4>
            <form method="POST" class="needs-validation" novalidate>
                <!-- CSRF Token for security -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <!-- Field for new password -->
                <div class="mb-3 position-relative">
                    <label for="password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your new password" required>
                    <!-- Error message for invalid password -->
                    <div class="invalid-feedback">Please enter a valid password.</div>
                </div>
                <!-- Field to confirm password -->
                <div class="mb-3 position-relative">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm your new password" required>
                    <!-- Error message if passwords don't match -->
                    <div class="invalid-feedback">Passwords must match.</div>
                </div>
                <!-- Button to submit the form -->
                <div class="mt-4 d-grid">
                    <button type="submit" class="btn btn-success">Reset Password</button>
                </div>
            </form>
            <!-- Link to go back to login -->
            <div class="text-center mt-3">
                <a href="{{ url_for('login.login_view') }}">Back to Login</a>
            </div>
        {% endif %}
    </div>
</div>

<!-- Animation style -->
<style>
    /* Container for checkmark animation */
    .checkmark-circle {
        width: 100px;
        height: 100px;
        position: relative;
        margin: 0 auto;
    }

    /* Green circle background */
    .checkmark-circle .background {
        width: 100px;
        height: 100px;
        background: #28a745;
        border-radius: 50%;
        position: absolute;
        top: 0;
        left: 0;
    }

    /* Checkmark inside the circle */
    .checkmark-circle .checkmark {
        width: 50px;
        height: 25px;
        border-width: 5px;
        border-style: solid;
        border-color: white;
        border-top: none;
        border-right: none;
        position: absolute;
        top: 30px;
        left: 25px;
        transform: rotate(-45deg);
        animation: draw 0.5s ease-out forwards; /* Drawing animation */
    }

    /* Animation to draw the checkmark */
    @keyframes draw {
        0% {
            width: 0;
            height: 0;
        }
        100% {
            width: 50px;
            height: 25px;
        }
    }
</style>

<script>
    // Form validation
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.querySelector('.needs-validation'); // Select form
        const password = document.getElementById('password'); // New password field
        const confirmPassword = document.getElementById('confirm_password'); // Confirm password field

        // Event on form submission
        form.addEventListener('submit', event => {
            // If the form is not valid or passwords don't match
            if (!form.checkValidity() || password.value !== confirmPassword.value) {
                event.preventDefault(); // Prevent submission
                event.stopPropagation(); // Stop event propagation
                if (password.value !== confirmPassword.value) {
                    // Show error if passwords don't match
                    confirmPassword.setCustomValidity("Passwords don't match.");
                } else {
                    // Clear error if passwords match
                    confirmPassword.setCustomValidity("");
                }
            }
            form.classList.add('was-validated'); // Add validation class to form
        });

        // Real-time matching validation
        confirmPassword.addEventListener('input', () => {
            confirmPassword.setCustomValidity(
                password.value === confirmPassword.value ? "" : "Passwords don't match."
            );
        });
    });
</script>
{% endblock %}
