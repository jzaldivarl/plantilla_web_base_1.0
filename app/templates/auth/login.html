<!-- app/templates/auth/login.html -->

{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 350px;">
        <h4 class="text-center mb-4">Login</h4>

        <!-- Login form -->
        <form method="POST" action="{{ url_for('login.login_view') }}" id="loginForm" novalidate>
            <!-- ✅ Hidden field for CSRF token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Email field -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="user@gmail.com" required>
                <div class="invalid-feedback">Please enter a valid email.</div>
            </div>

            <!-- Password field -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="************" required>
                <div class="invalid-feedback">Please enter your password.</div>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
        </form>

        <!-- Link for password recovery -->
        <div class="text-center mt-2">
            <a href="{{ url_for('recovery_pass.reset_password_request') }}" class="small" style="text-decoration: none;">Forgot your password?</a>
        </div>

        <!-- Link to register -->
        <div class="text-center mt-3">
            <p class="small">Don't have an account? <a style="text-decoration: none;" href="{{ url_for('register.register_view') }}">Sign up here</a></p>
        </div>
    </div>
</div>

<!-- ✅ Client-side validation script -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('loginForm');

        form.addEventListener('submit', function (event) {
            // 🚨 Prevent submission if the form is invalid
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }

            // Add Bootstrap class to display errors
            form.classList.add('was-validated');
        });
    });
</script>
{% endblock %}
