<!-- app/templates/login.html -->

{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 350px;">
        <h4 class="text-center mb-4">Iniciar Sesión</h4>

        <!-- Formulario de login -->
        <form method="POST" action="{{ url_for('login.login_view') }}">
            <!-- ✅ Campo oculto para el token CSRF -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Campo para email -->
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Ingresa tu correo" required>
            </div>

            <!-- Campo para contraseña -->
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>

            <!-- Botón de envío -->
            <button type="submit" class="btn btn-primary w-100 mt-3">Iniciar Sesión</button>
        </form>

        <!-- Link para registrarse -->
        <div class="text-center mt-3">
            <p class="small">¿No tienes una cuenta? <a style="text-decoration: none;" href="{{ url_for('register.register_view') }}">Regístrate aquí</a></p>
        </div>
    </div>
</div>
{% endblock %}
